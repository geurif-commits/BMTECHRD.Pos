name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore BMTECHRD.Pos.slnx

      - name: Build (Release)
        run: dotnet build BMTECHRD.Pos.slnx -c Release --no-restore

      - name: Test + Coverage (Solution)
        run: >
          dotnet test BMTECHRD.Pos.slnx
          -c Release
          --no-build
          --logger "trx;LogFileName=authharness.trx"
          --collect:"XPlat Code Coverage"

      - name: Enforce coverage threshold
        shell: pwsh
        run: |
          $coverageFile = Get-ChildItem -Path . -Recurse -Filter *cobertura.xml | Select-Object -First 1
          if (-not $coverageFile) { throw "Coverage file not found (cobertura.xml)." }

          [xml]$xml = Get-Content $coverageFile.FullName
          $lineRate = [double]$xml.coverage.'line-rate'
          $percent = [math]::Round($lineRate * 100, 2)

          Write-Host "Line coverage: $percent%"

          if ($percent -lt 60) {
            throw "Coverage gate failed. Minimum required: 60%. Actual: $percent%."
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/*.trx

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            **/TestResults/**/coverage.cobertura.xml
            **/TestResults/**/cobertura.xml

      - name: Upload auth logs (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-logs
          path: |
            ${{ env.APPDATA }}\BMTECHRD\POS\logs\auth-*.log
