name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test (AuthHarness)
        run: dotnet test BMTECHRD.Pos.AuthHarness.Tests/BMTECHRD.Pos.AuthHarness.Tests.csproj -c Release --no-build --logger "trx;LogFileName=authharness.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/*.trx

      - name: Upload auth logs (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-logs
          path: |
            ${{ env.APPDATA }}\BMTECHRD\POS\logs\auth-*.log

  e2e:
    name: E2E (manual)
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run E2E verification script
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          pwsh -NoProfile -Command "Set-StrictMode -Version Latest; ./scripts/verify_auth_e2e.ps1 -BaseUrl $env:E2E_BASE_URL -Username $env:E2E_USERNAME -Password $env:E2E_PASSWORD"

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: evidence/
