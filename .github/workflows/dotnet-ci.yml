name: dotnet-ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore BMTECHRD.Pos.slnx

      - name: Build
        run: dotnet build BMTECHRD.Pos.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test BMTECHRD.Pos.slnx --configuration Release --no-build
